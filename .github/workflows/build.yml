name: Build & Release Overdesk Everyone

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (React/Vite)
        run: npm run build

      - name: Extract App Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version is $VERSION"

      - name: Ensure Git Tag Exists for Release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${PACKAGE_VERSION}" || true
          git push origin "v${PACKAGE_VERSION}" --force || true

      - name: Build & Publish Windows Executables (Electron Builder)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Publish Public GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Publishing release v${PACKAGE_VERSION} as latest public release..."
          gh release edit "v${PACKAGE_VERSION}" --draft=false --latest --generate-notes || \
          gh release edit "v${PACKAGE_VERSION}" --draft=false --latest || \
          gh release create "v${PACKAGE_VERSION}" dist-electron/*.exe dist-electron/*.yml dist-electron/*.blockmap --title "Overdesk Everyone v${PACKAGE_VERSION}" --generate-notes --latest || true

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdesk-Everyone-exe
          path: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
          if-no-files-found: warn
